name: Deploy Elas Fazem to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npx ng build --configuration production --base-href /elas-fazem-mvp/
      - run: cp dist/elas-fazem-mvp/browser/index.html dist/elas-fazem-mvp/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/elas-fazem-mvp/browser
      - uses: actions/deploy-pages@v4
